
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      KLINE_DIR: /app/storage/klines
      INSTRUMENTS_CACHE: /app/storage/instruments.json
    volumes:
      - backend-data:/app/storage
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: http://localhost:8080
      NEXT_PUBLIC_GATEWAY_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
